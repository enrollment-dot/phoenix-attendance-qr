name: Session Auto-Close PostgreSQL Regression

on:
  # Run on every PR so the required postgres-regression check is always reported.
  pull_request:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tests/sql/session-auto-close-*.sql"
      - ".github/workflows/session-auto-close-db-test.yml"

permissions:
  contents: read

concurrency:
  group: postgres-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prepare disposable test schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/session-auto-close-setup.sql
      - name: Apply actual auto-close migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012120000_secure_session_auto_close_scheduler.sql
      - name: Apply manual close timestamp migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016160000_fix_manual_session_close_updated_at.sql
      - name: Verify auto-close behavior and execution privileges
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/session-auto-close-assertions.sql
      - name: Verify manual close timestamp and execution privileges
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/session-auto-close-timestamp-assertions.sql

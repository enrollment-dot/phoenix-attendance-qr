name: YLP Session Auto-Close (Staging)

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes (UTC); this workflow targets the staging environment only.
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: ylp-session-auto-close-staging
  cancel-in-progress: false

jobs:
  auto-close-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test scheduler response envelope validation
        run: bash tests/scripts/test-scheduler-response-envelope.sh
      - name: Validate staging scheduler configuration
        env:
          API_URL: ${{ secrets.YLP_STAGING_API_URL }}
          SCHEDULER_SECRET: ${{ secrets.YLP_STAGING_SCHEDULER_SECRET }}
        run: |
          test -n "$API_URL" || { echo "Missing environment secret YLP_STAGING_API_URL"; exit 1; }
          test -n "$SCHEDULER_SECRET" || { echo "Missing environment secret YLP_STAGING_SCHEDULER_SECRET"; exit 1; }
          test "$API_URL" = "https://yvtgwzvjpztvztozcfir.supabase.co/functions/v1/ylp-api" \
            || { echo "API_URL must match the exact staging ylp-api endpoint"; exit 1; }
      - name: Close eligible staging sessions
        env:
          API_URL: ${{ secrets.YLP_STAGING_API_URL }}
          SCHEDULER_SECRET: ${{ secrets.YLP_STAGING_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST "$API_URL" \
            --header "content-type: application/json" \
            --header "x-ylp-scheduler-secret: $SCHEDULER_SECRET" \
            --data '{"action":"schedulerAutoClose","payload":{}}')"

          # The API can return application errors inside HTTP 200 responses.
          if ! jq -e '.ok == true and (.data.closed_count | type == "number")' "$response_file" >/dev/null; then
            echo "Scheduler API did not return a successful response envelope (HTTP $status)."
            jq -c '{ok, error, data}' "$response_file" || true
            exit 1
          fi

          jq -c '{ok, data: {closed_count: .data.closed_count}}' "$response_file"
